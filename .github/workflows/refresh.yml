name: publish latest Wolfi PHP
# Every ten minutes: capture Wolfi's recipe for the stream policy.json names,
# check that every patch still applies, and build and publish a release for
# each new Wolfi build. What stops a release is filed as an issue (drift.py).
on:
  schedule:
    - cron: '3-53/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: publish-latest-wolfi
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      # GitHub requires push access to discover recoverable draft releases.
      contents: write
      issues: write
    outputs:
      state: ${{ steps.check.outputs.state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools and run the unit tests
        run: |
          python3 -m venv build/venv
          build/venv/bin/pip install -r requirements.txt
          make PYTHON=build/venv/bin/python test
      - name: Capture Wolfi's latest PHP recipe
        id: refresh
        run: |
          set -o pipefail
          build/venv/bin/python scripts/refresh.py 2>&1 | tee build/refresh.log
      - name: Verify the derivation
        id: derivation
        run: |
          set -o pipefail
          make PYTHON=build/venv/bin/python verify derive 2>&1 | tee build/derivation.log
      - name: Apply every patch to the locked php-src
        id: patches
        run: |
          set -o pipefail
          make PYTHON=build/venv/bin/python prepare 2>&1 | tee build/patches.log
      - name: File a capture that stopped
        if: failure() && steps.refresh.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: build/venv/bin/python scripts/drift.py refresh build/refresh.log
      - name: File a derivation that stopped
        if: failure() && steps.derivation.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: build/venv/bin/python scripts/drift.py derivation build/derivation.log
      - name: File a patch that no longer applies
        if: failure() && steps.patches.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: build/venv/bin/python scripts/drift.py patches build/patches.log
      - name: Close what this run shows fixed
        env:
          GH_TOKEN: ${{ github.token }}
        run: build/venv/bin/python scripts/drift.py resolved
      - name: File, or close, a newer Wolfi PHP stream
        if: always() && steps.refresh.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: build/venv/bin/python scripts/drift.py stream
      - run: tar -czf build/wolfi-inputs.tar.gz -C build/inputs .
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: build/venv/bin/python scripts/publish.py status
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.check.outputs.state != 'complete'
        with:
          name: wolfi-inputs
          path: build/wolfi-inputs.tar.gz
          if-no-files-found: error
  build:
    needs: discover
    if: needs.discover.outputs.state == 'build'
    uses: ./.github/workflows/build.yml
    with:
      inputs_artifact: wolfi-inputs
      production: true
    secrets: inherit
  publish:
    needs: [discover, build]
    if: >-
      always() && !cancelled() && needs.discover.result == 'success' &&
      (needs.build.result == 'success' || needs.discover.outputs.state == 'publish')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 -m venv build/venv
          build/venv/bin/pip install -r requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wolfi-inputs
          path: build/input-bundle
      - name: Restore captured inputs with their file modes
        run: |
          mkdir -p build/inputs
          tar -xzf build/input-bundle/wolfi-inputs.tar.gz -C build/inputs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.build.result == 'success'
        with:
          pattern: php-*
          path: artifacts
      - name: Stage a recoverable draft from both successful builds
        if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: build/venv/bin/python scripts/publish.py stage
      - name: Write production signing key for the stable index
        env:
          PHP_APK_SIGNING_KEY: ${{ secrets.WEREWOLF_PACKAGES_KEY }}
        run: |
          test -n "$PHP_APK_SIGNING_KEY"
          build/venv/bin/python scripts/signing-key.py
      - name: Publish signed APK repositories and complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          build/venv/bin/python scripts/publish.py publish
